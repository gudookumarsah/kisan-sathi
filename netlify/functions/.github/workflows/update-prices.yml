name: Update Kisan Sathi Prices

on:
  schedule:
    - cron: '30 3 * * *'  # ~09:15 Nepal time (UTC+5:45) — adjust if needed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "kisan-sathi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update AMPIS prices"
          git push
